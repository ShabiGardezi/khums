# Render Blueprint for the private scholar-review API (M4.7; docs/DEPLOYMENT_FREE_TIER.md).
# Free instance type, $0/month. Holds NO secret values: every `sync: false` variable is entered
# by the maintainer in the Render dashboard. Deploys are manual (autoDeploy: false).
services:
  - type: web
    name: khums-api
    runtime: docker
    plan: free
    # Closest Render region to the Atlas cluster (AWS Mumbai).
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: KHUMS_OPERATIONAL_STATE
        value: SCHOLAR_REVIEW
      # Only the signed web tier is answered; the onrender.com URL is useless on its own.
      - key: KHUMS_REQUIRE_EDGE_SIGNATURE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: MONGODB_DATABASE
        value: khums
      # The free Vercel production URL, exactly (https://<project>.vercel.app).
      - key: CORS_ORIGINS
        sync: false
      # SECRET. Temporary arrangement (owner decision 2026-11-22): the existing Atlas user,
      # backend environment only. Replaced by the least-privilege khumsApp user later.
      - key: MONGODB_URI
        sync: false
      # SECRET. Throttle-key HMAC; generated by Render, never shared.
      - key: STAFF_AUTH_SECRET
        generateValue: true
      # SECRET. Shared with the Vercel project only (same value in both).
      - key: STAFF_EDGE_SECRET
        sync: false
