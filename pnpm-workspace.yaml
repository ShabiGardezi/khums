packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions.
# Workspace package.json files reference these with "catalog:".
catalog:
  # Tooling
  turbo: 2.11.12
  typescript: 6.0.3
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.73.0
  eslint-config-prettier: 10.1.8
  eslint-config-next: 16.4.6
  globals: 17.14.0
  prettier: 3.10.1
  vitest: 5.1.1
  '@vitest/coverage-v8': 5.1.1
  '@playwright/test': 1.65.1
  '@types/node': 26.6.6

  # Web
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  tailwindcss: 4.3.5
  '@tailwindcss/postcss': 4.3.5
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  lucide-react: 1.75.0

  # Web testing
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/user-event': 14.6.12
  jsdom: 29.1.1
  '@axe-core/playwright': 4.14.0

  # Shared logic
  zod: 4.6.7
  decimal.js: 10.6.0
  # Audited, dependency-free, pure-JS SHA-256 (rule-pack integrity, FR-1)
  '@noble/hashes': 2.0.1

  # API (NestJS)
  '@nestjs/common': 12.5.1
  '@nestjs/core': 12.5.1
  '@nestjs/platform-express': 12.5.1
  '@nestjs/swagger': 12.1.2
  '@nestjs/testing': 12.5.1
  '@nestjs/cli': 12.0.13
  nestjs-pino: 5.3.2
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  helmet: 8.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  '@types/express': 5.0.6
  '@swc/core': 1.16.22
  unplugin-swc: 2.0.0
  '@rspack/core': 2.3.3
  webpack-node-externals: 3.0.0
  # Official MongoDB driver (API persistence, M4.6.3a; ARCHITECTURE decision 38)
  mongodb: 7.8.0

# Dependency lifecycle scripts are blocked unless listed here (supply-chain hardening).
allowBuilds:
  '@swc/core': true # verifies the native binary for this platform
  '@scarf/scarf': false # install-time telemetry from swagger-ui-dist; not allowed (docs/SECURITY.md)

